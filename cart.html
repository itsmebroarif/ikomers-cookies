<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Pesanan — iKomers Cookies</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AA%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="cart">

  <div id="navbarMount"></div>

  <!-- Page header -->
  <header class="py-4" style="background:linear-gradient(180deg,var(--cream-2),var(--cream))">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb small mb-2">
          <li class="breadcrumb-item"><a href="index.html" class="text-caramel">Beranda</a></li>
          <li class="breadcrumb-item active" aria-current="page">Menu Pesanan</li>
        </ol>
      </nav>
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
          <h1 class="section-title mb-1">Menu Pesanan</h1>
          <p class="text-muted-2 mb-0">Periksa kembali cookies pilihanmu sebelum lanjut ke checkout.</p>
        </div>
        <a href="index.html#produk" class="btn btn-ghost"><i class="bi bi-plus-lg me-1"></i>Tambah Produk</a>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-4">
      <!-- Daftar item -->
      <div class="col-lg-8">
        <div class="panel" id="cartPanel">
          <div class="skeleton" style="height:120px"></div>
        </div>
      </div>

      <!-- Ringkasan pesanan -->
      <div class="col-lg-4">
        <div class="panel sticky-panel">
          <h5 class="panel-title"><i class="bi bi-receipt text-caramel me-2"></i>Ringkasan Pesanan</h5>

          <div id="summaryBody">
            <div class="skeleton" style="height:180px"></div>
          </div>

          <div class="mt-3">
            <label class="form-label" for="promoInput">Kode promo</label>
            <div class="input-group">
              <input type="text" class="form-control" id="promoInput" placeholder="Contoh: COOKIE10" aria-label="Kode promo">
              <button class="btn btn-ghost" id="applyPromoBtn" type="button">Pakai</button>
            </div>
            <div class="small text-muted-2 mt-2">
              Coba: <code class="text-caramel">COOKIE10</code> (diskon 10%) atau <code class="text-caramel">ONGKIRGRATIS</code>.
            </div>
          </div>

          <div class="d-grid gap-2 mt-3">
            <a href="checkout.html" class="btn btn-cookie btn-lg" id="goCheckout">
              <i class="bi bi-credit-card me-1"></i>Lanjut ke Checkout
            </a>
            <button class="btn btn-ghost btn-sm" id="clearCartBtn"><i class="bi bi-trash3 me-1"></i>Kosongkan Keranjang</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footerMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cart-page.js"></script>
</body>
</html>
